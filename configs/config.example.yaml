# Valores de exemplo. Segredos ficam em variáveis de ambiente, nunca neste arquivo.
# O bloco oracle fica comentado para a subida local não exigir senha.

server:
  address: "127.0.0.1:8080"
  public_base_url: "https://mcp.exemplo.com"
  read_timeout: "15s"
  write_timeout: "30s"

auth:
  sqlite_path: "./data/identity.db"
  access_token_ttl: "15m"
  refresh_token_ttl: "168h"

# Host vazio deixa o Oracle desligado. Descomente só com credencial nas variáveis abaixo.
# Use service_name ou sid, nunca os dois.
# oracle:
#   host: "oracle.exemplo.local"
#   port: 1521
#   service_name: "BI"
#   sid: "bi"
#   username_env: "ORACLE_MCP_DB_USER"
#   password_env: "ORACLE_MCP_DB_PASSWORD"
#   query_timeout: "30s"
#   max_open_connections: 10
#   max_idle_connections: 5
#
# bi:
#   max_rows: 1000
#   max_response_bytes: 2097152
